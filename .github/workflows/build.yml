name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          # 下载官方 iOS SDK (这是修复的关键)
          git clone --depth 1 https://github.com/theos/sdks.git temp_sdks
          mv temp_sdks/*.sdk $HOME/theos/sdks/
          rm -rf temp_sdks
        env:
          THEOS: ${{ env.THEOS }}

      - name: Build Package
        run: |
          # 尝试进入 source_code 目录，避免目录找不到
          if [ -d "source_code" ]; then
            cd source_code
          fi
          # 强制编译
          make package FINALPACKAGE=1 DEBUG=0
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            packages/*.deb
            source_code/packages/*.deb
