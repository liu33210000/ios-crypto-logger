name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          # 下载 iOS SDK，防止因缺少 SDK 导致编译失败
          git clone --depth 1 https://github.com/XYI-M/theos-sdks.git temp_sdks
          cp -r temp_sdks/*.sdk $HOME/theos/sdks/
          rm -rf temp_sdks
        env:
          THEOS: ${{ env.THEOS }}

      - name: Build Package
        run: |
          # 尝试进入 source_code 目录，如果不存在则在当前目录编译
          if [ -d "source_code" ]; then
            cd source_code
          fi
          # 禁用签名检查，强制编译
          make package FINALPACKAGE=1 DEBUG=0
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            packages/*.deb
            source_code/packages/*.deb
